services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - SERVER_NAME=${SERVER_NAME:-addons.neverball.org}
      - BASE_URL=${BASE_URL:-https://addons.neverball.org}
      - GOTIFY_URL=${GOTIFY_URL:-http://gotify:80}
      - GOTIFY_TOKEN=${GOTIFY_TOKEN}
      - GOTIFY_PATH=${GOTIFY_PATH:-gotify}
      - GITHUB_PACKAGES_REPO=${GITHUB_PACKAGES_REPO}
      - GITHUB_DISPATCH_TOKEN=${GITHUB_DISPATCH_TOKEN}
    volumes:
      - app_storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gotify

  gotify:
    image: gotify/server:2.6.1
    restart: unless-stopped
    environment:
      - GOTIFY_SERVER_PORT=80
      - GOTIFY_DATABASE_DIALECT=sqlite3
    volumes:
      - gotify_data:/app/data

volumes:
  app_storage:
  caddy_data:
  caddy_config:
  gotify_data:
